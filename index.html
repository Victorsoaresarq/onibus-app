<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cadê o Ônibus? • Mobilidade Carioca</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Cadê o Ônibus">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#faf7f2;--card:#fff;--primary:#1b6354;--text:#1f2937;--text-muted:#6b7280;--danger:#b91c1c;--warning:#a16207}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}header{padding:14px 20px 6px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px}.brand-icon{background:var(--primary);color:#fff;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 10px rgba(27,99,84,.2)}.brand h1{font-size:18px;font-weight:800;letter-spacing:-.3px}.brand p{font-size:9.5px;font-weight:700;letter-spacing:.8px;color:var(--text-muted);text-transform:uppercase}.btn-geo{background:#fff;border:1px solid rgba(0,0,0,.08);padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:5px;cursor:pointer}.btn-geo:disabled,.btn-add:disabled{opacity:.6;cursor:wait}.controls{padding:4px 18px 8px;z-index:10;overflow-y:auto}.search-card{background:var(--card);padding:12px 14px;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.04)}.search-card label{font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px;display:block}.input-group{display:flex;gap:8px}.input-wrapper{position:relative;flex:1;display:flex;align-items:center}.input-wrapper span{position:absolute;left:12px;font-size:14px;color:var(--text-muted)}input[type=text]{width:100%;padding:10px 12px 10px 34px;font-size:15px;font-weight:600;border:1px solid #e5e7eb;background:#fafafa;border-radius:12px;outline:none}input[type=text]:focus{border-color:rgba(27,99,84,.45);box-shadow:0 0 0 3px rgba(27,99,84,.08)}.btn-add{background:var(--primary);color:#fff;border:0;padding:0 16px;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer}.chips-container{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.line-chip{background:#f9fafb;border:1px solid #e5e7eb;padding:4px 8px;border-radius:10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}.line-chip.is-fav{background:#fffbeb;border-color:#fde68a}.color-picker-input{-webkit-appearance:none;appearance:none;border:0;width:18px;height:18px;border-radius:50%;cursor:pointer;padding:0;background:transparent}.color-picker-input::-webkit-color-swatch-wrapper{padding:0}.color-picker-input::-webkit-color-swatch{border:2px solid #fff;border-radius:50%;box-shadow:0 0 2px rgba(0,0,0,.4)}.chip-remove{background:0;border:0;font-size:15px;color:#9ca3af;cursor:pointer;line-height:1}.chip-fav{background:0;border:0;font-size:13px;cursor:pointer;line-height:1;color:#d1d5db}.chip-fav.active{color:#d97706}.chip-route{background:0;border:0;font-size:12px;cursor:pointer;line-height:1;color:#9ca3af;padding:0 1px}.chip-route.active{color:var(--primary)}.quick-tags{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}.quick-tags span{font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase}.tag-btn{background:#f3f4f6;border:0;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--text);cursor:pointer}.tag-btn:hover{background:#e5e7eb}.fav-section{margin-top:8px;padding-top:8px;border-top:1px dashed #e5e7eb}.fav-section-label{font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:4px}.fav-chip{background:#fffbeb;border:1px solid #fde68a;padding:4px 9px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;color:#92400e}.fav-chip:hover{background:#fef3c7}#status-msg{font-size:11.5px;font-weight:500;color:var(--text-muted);margin-top:6px;min-height:16px}#map-container{flex:1;position:relative;border-top-left-radius:24px;border-top-right-radius:24px;overflow:hidden}#map{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%}
.bus-marker-pin{display:flex;align-items:center;justify-content:center;gap:3px;color:#fff;padding:3px 6px;border-radius:10px;font-size:11px;font-weight:800;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35);white-space:nowrap}.bus-marker-pin.stale{opacity:.65}.bus-marker-pin.selected{border-color:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.35);transform:scale(1.12)}.map-legend{background:#fff;padding:7px 10px;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:11px;line-height:1.5;max-width:min(360px,calc(100vw - 28px))}.legend-row{display:flex;align-items:center;gap:7px;margin:2px 0}.legend-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}.legend-error{color:var(--danger)}.legend-stale{color:var(--warning)}.popup{font-size:13px;line-height:1.5;min-width:170px}.popup-title{font-size:15px;font-weight:800;margin-bottom:4px}.popup-muted{color:var(--text-muted);font-size:11px;margin-top:5px}.popup-select-btn{margin-top:7px;width:100%;background:var(--primary);color:#fff;border:0;padding:6px 8px;border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer}.selected-panel{position:absolute;left:12px;right:12px;bottom:12px;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:12px 14px;z-index:20;display:none}.selected-panel.visible{display:block}.selected-panel-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.selected-panel-title{font-size:14px;font-weight:800}.selected-panel-close{background:#f3f4f6;border:0;width:24px;height:24px;border-radius:50%;font-size:14px;cursor:pointer;color:var(--text-muted);flex:0 0 auto}.selected-panel-body{margin-top:6px;font-size:12.5px;color:var(--text-muted);display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}.selected-panel-body b{color:var(--text)}@media(max-width:520px){header{padding-left:14px;padding-right:14px}.controls{padding-left:12px;padding-right:12px}.brand p{letter-spacing:.5px}.btn-geo{padding:7px 10px}.btn-add{padding:0 13px}}
</style>
</head>
<body>
<header><div class="brand"><div class="brand-icon">🚌</div><div><h1>Cadê o Ônibus?</h1><p>Mobilidade Carioca • Sem Pressa</p></div></div><button id="btnGeo" class="btn-geo" onclick="localizarUsuario()">📍 Onde estou</button></header>
<section class="controls">
<div class="search-card">
<label>Quais linhas você quer monitorar?</label>
<div class="input-group"><div class="input-wrapper"><span>🔍</span><input id="linhaInput" type="text" inputmode="numeric" autocomplete="off" placeholder="Ex: 232, 606, 693..." aria-label="Número da linha"></div><button id="btnAdd" class="btn-add" onclick="adicionarLinha()">Adicionar</button></div>
<div class="quick-tags"><span>Tente:</span><button class="tag-btn" onclick="atalhoLinha('232')">232</button><button class="tag-btn" onclick="atalhoLinha('606')">606</button><button class="tag-btn" onclick="atalhoLinha('693')">693</button><button class="tag-btn" onclick="atalhoLinha('2345')">2345</button></div>
<div class="chips-container" id="chipsContainer"></div>
<div class="fav-section" id="favSection" style="display:none"><div class="fav-section-label">⭐ Fixadas</div><div class="chips-container" id="favChipsContainer"></div></div>
<div id="status-msg">Adicione uma linha acima para iniciar o monitoramento.</div>
</div>
</section>
<main id="map-container">
<div id="map"></div>
<div class="selected-panel" id="selectedPanel">
<div class="selected-panel-header"><div class="selected-panel-title" id="selectedPanelTitle">Ônibus</div><button class="selected-panel-close" onclick="limparSelecao()">×</button></div>
<div class="selected-panel-body" id="selectedPanelBody"></div>
</div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body></html>
