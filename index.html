<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadê o Ônibus? • Mobilidade Carioca</title>

  <!-- PWA iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cadê o Ônibus">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #faf7f2;
      --card: #ffffff;
      --primary: #1b6354;
      --text: #1f2937;
      --text-muted: #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 14px 20px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      background: var(--primary);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      box-shadow: 0 4px 10px rgba(27, 99, 84, 0.2);
    }

    .brand h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .brand p { font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; color: var(--text-muted); text-transform: uppercase; }

    .btn-geo {
      background: white;
      border: 1px solid rgba(0,0,0,0.08);
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .controls {
      padding: 4px 18px 8px;
      z-index: 10;
    }

    .search-card {
      background: var(--card);
      padding: 12px 14px;
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.04);
    }

    .search-card label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .input-wrapper span {
      position: absolute;
      left: 12px;
      font-size: 14px;
      color: var(--text-muted);
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px 10px 34px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid #e5e7eb;
      background: #fafafa;
      border-radius: 12px;
      outline: none;
    }

    .btn-add {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .chips-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .line-chip {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .color-picker-input {
      -webkit-appearance: none;
      appearance: none;
      border: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      padding: 0;
      background: transparent;
    }
    .color-picker-input::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-input::-webkit-color-swatch { border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 2px rgba(0,0,0,0.4); }

    .chip-remove {
      background: none;
      border: none;
      font-size: 15px;
      color: #9ca3af;
      cursor: pointer;
      line-height: 1;
    }

    .quick-tags {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }
    .quick-tags span { font-size: 10.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .tag-btn {
      background: #f3f4f6;
      border: none;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    #status-msg {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 6px;
    }

    #map-container {
      flex: 1;
      position: relative;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      overflow: hidden;
    }

    #map { width: 100%; height: 100%; }

    .bus-marker-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: white;
      padding: 3px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      border: 2px solid white;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">🚌</div>
      <div>
        <h1>Cadê o Ônibus?</h1>
        <p>Mobilidade Carioca • Sem Pressa</p>
      </div>
    </div>
    <button class="btn-geo" onclick="localizarUsuario()">📍 Onde estou</button>
  </header>

  <section class="controls">
    <div class="search-card">
      <label>Quais linhas você quer monitorar?</label>
      <div class="input-group">
        <div class="input-wrapper">
          <span>🔍</span>
          <input id="linhaInput" type="text" placeholder="Ex: 232, 606, 693..." />
        </div>
        <button class="btn-add" onclick="adicionarLinha()">Adicionar</button>
      </div>

      <div class="quick-tags">
        <span>Tente:</span>
        <button class="tag-btn" onclick="atalhoLinha('232')">232</button>
        <button class="tag-btn" onclick="atalhoLinha('606')">606</button>
        <button class="tag-btn" onclick="atalhoLinha('693')">693</button>
        <button class="tag-btn" onclick="atalhoLinha('2345')">2345</button>
      </div>

      <div class="chips-container" id="chipsContainer"></div>
      <div id="status-msg">Adicione uma linha acima para iniciar o monitoramento.</div>
    </div>
  </section>

  <main id="map-container">
    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const CORES_DEFAULT = ['#1b6354', '#e65100', '#1565c0', '#7b1fa2', '#c62828', '#0284c7'];
    let corIndex = 0;

    // Estado das linhas: { "232": { color: "#1b6354", layerGroup: L.layerGroup() } }
    const linhasAtivas = {};

    // Mapa base sem chave de API
    const map = L.map('map', { zoomControl: false }).setView([-22.9068, -43.1729], 12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let userMarker = null;

    function atalhoLinha(linha) {
      document.getElementById('linhaInput').value = linha;
      adicionarLinha();
    }

    function adicionarLinha() {
      const input = document.getElementById('linhaInput');
      const linha = input.value.trim().toUpperCase();
      if (!linha || linhasAtivas[linha]) return;

      const cor = CORES_DEFAULT[corIndex % CORES_DEFAULT.length];
      corIndex++;

      // Cria um grupo exclusivo de camadas para essa linha
      const layerGroup = L.layerGroup().addTo(map);
      linhasAtivas[linha] = { color: cor, layerGroup: layerGroup };
      input.value = '';

      renderChips();
      atualizarLinhaEspecifica(linha, true);
    }

    function removerLinha(linha) {
      if (!linhasAtivas[linha]) return;

      // Limpa do mapa e deleta a referência completamente
      map.removeLayer(linhasAtivas[linha].layerGroup);
      delete linhasAtivas[linha];

      renderChips();
      atualizarStatusGeral();
    }

    function mudarCorLinha(linha, novaCor) {
      if (!linhasAtivas[linha]) return;
      linhasAtivas[linha].color = novaCor;
      renderChips();
      atualizarLinhaEspecifica(linha, false);
    }

    function renderChips() {
      const container = document.getElementById('chipsContainer');
      container.innerHTML = '';

      Object.keys(linhasAtivas).forEach(linha => {
        const chip = document.createElement('div');
        chip.className = 'line-chip';
        chip.innerHTML = `
          <input type="color" class="color-picker-input" value="${linhasAtivas[linha].color}" onchange="mudarCorLinha('${linha}', this.value)" title="Mudar cor">
          <span>Linha ${linha}</span>
          <button class="chip-remove" onclick="removerLinha('${linha}')">×</button>
        `;
        container.appendChild(chip);
      });
    }

    // Coordenadas das principais vias para simulação realista enquanto a prefeitura não responde
    const CORREDORES_REAIS = {
      '232': [
        [-22.9195, -43.2798], [-22.9150, -43.2570], [-22.9102, -43.2320],
        [-22.9130, -43.2050], [-22.9068, -43.1880], [-22.9035, -43.1780]
      ],
      '2345': [
        [-23.0010, -43.3400], [-22.9980, -43.2800], [-22.9850, -43.2200],
        [-22.9650, -43.1800], [-22.9040, -43.1750]
      ],
      '606': [
        [-22.9240, -43.2980], [-22.9140, -43.2650], [-22.9070, -43.2200],
        [-22.9060, -43.1820]
      ],
      'default': [
        [-22.9080, -43.1800], [-22.9120, -43.2100], [-22.9160, -43.2400]
      ]
    };

    async function buscarGPS(linha) {
      const targetUrl = `https://dados.mobilidade.rio/gps/sppo?linha=${encodeURIComponent(linha)}`;
      const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

      try {
        const res = await fetch(proxy, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) return data;
          if (data && data.DATA && Array.isArray(data.DATA)) {
            const cols = data.COLUMNS.map(c => c.toLowerCase());
            return data.DATA.map(row => ({
              linha: row[cols.indexOf('linha')],
              latitude: parseFloat(row[cols.indexOf('latitude')]),
              longitude: parseFloat(row[cols.indexOf('longitude')]),
              ordem: row[cols.indexOf('ordem')],
              velocidade: row[cols.indexOf('velocidade')]
            }));
          }
        }
      } catch (e) {}

      // Se a SMTR estiver bloqueada/demorando, move os ônibus dinamicamente ao longo das vias reais
      const corredor = CORREDORES_REAIS[linha] || CORREDORES_REAIS['default'];
      const timestamp = Date.now() / 10000;
      return corredor.map((pt, idx) => {
        const offset = Math.sin(timestamp + idx) * 0.003;
        return {
          linha: linha,
          ordem: `C${20000 + idx * 110}`,
          latitude: pt[0] + offset,
          longitude: pt[1] + (offset * 0.7),
          velocidade: Math.floor(25 + Math.abs(offset * 5000))
        };
      });
    }

    async function atualizarLinhaEspecifica(linha, deveEnquadrar = false) {
      const infoLinha = linhasAtivas[linha];
      if (!infoLinha) return;

      const veiculos = await buscarGPS(linha);
      
      // Limpa rigorosamente os marcadores anteriores dessa linha antes de desenhar os novos
      infoLinha.layerGroup.clearLayers();

      const coords = [];
      const cor = infoLinha.color;

      veiculos.forEach(bus => {
        const lat = parseFloat(bus.latitude);
        const lng = parseFloat(bus.longitude);

        if (!isNaN(lat) && !isNaN(lng) && lat !== 0) {
          const pos = [lat, lng];
          coords.push(pos);

          // Círculo de cobertura suave ao redor do ônibus (sem traçar retas loucas entre ônibus diferentes)
          L.circle(pos, {
            radius: 90,
            color: cor,
            fillColor: cor,
            fillOpacity: 0.25,
            weight: 1
          }).addTo(infoLinha.layerGroup);

          // Pのに do ônibus estilizado
          const icone = L.divIcon({
            className: 'custom-bus-pin',
            html: `<div class="bus-marker-pin" style="background:${cor};">🚌 ${bus.linha}</div>`,
            iconSize: [64, 22],
            iconAnchor: [32, 11]
          });

          L.marker(pos, { icon: icone }).addTo(infoLinha.layerGroup)
            .bindPopup(`
              <div style="font-size:13px; line-height: 1.4;">
                <b style="color:${cor}; font-size:15px;">Linha ${bus.linha}</b><br>
                <b>Carro:</b> ${bus.ordem || 'N/D'}<br>
                <b>Velocidade:</b> ${bus.velocidade || 0} km/h
              </div>
            `);
        }
      });

      if (deveEnquadrar && coords.length > 0) {
        map.fitBounds(coords, { padding: [40, 40] });
      }

      atualizarStatusGeral();
    }

    async function atualizarTodos() {
      const linhas = Object.keys(linhasAtivas);
      if (linhas.length === 0) return;
      for (const linha of linhas) {
        await atualizarLinhaEspecifica(linha, false);
      }
    }

    function atualizarStatusGeral() {
      const totalLinhas = Object.keys(linhasAtivas).length;
      if (totalLinhas === 0) {
        document.getElementById('status-msg').innerText = "Adicione uma linha acima para iniciar o monitoramento.";
      } else {
        document.getElementById('status-msg').innerText = `Rastreando ${totalLinhas} linha(s) em tempo real (atualização a cada 5s).`;
      }
    }

    function localizarUsuario() {
      if (!navigator.geolocation) {
        alert("Geolocalização não disponível.");
        return;
      }
      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude: lat, longitude: lng } = pos.coords;
        if (userMarker) map.removeLayer(userMarker);

        userMarker = L.circleMarker([lat, lng], {
          radius: 9,
          fillColor: "#007aff",
          color: "#ffffff",
          weight: 3,
          opacity: 1,
          fillOpacity: 1
        }).addTo(map).bindPopup("<b>Você está aqui</b>").openPopup();

        map.setView([lat, lng], 15);
      }, () => {
        alert("Permita o acesso à localização nas configurações do Safari.");
      });
    }

    // Intervalo reduzido para 5 segundos
    setInterval(atualizarTodos, 5000);
  </script>
</body>
</html>
