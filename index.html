<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadê o Ônibus? • Mobilidade Carioca</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cadê o Ônibus">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #faf7f2;
      --card: #ffffff;
      --primary: #1b6354;
      --text: #1f2937;
      --text-muted: #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 14px 20px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      background: var(--primary);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      box-shadow: 0 4px 10px rgba(27, 99, 84, 0.2);
    }

    .brand h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .brand p { font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; color: var(--text-muted); text-transform: uppercase; }

    .btn-geo {
      background: white;
      border: 1px solid rgba(0,0,0,0.08);
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .controls {
      padding: 4px 18px 8px;
      z-index: 10;
    }

    .search-card {
      background: var(--card);
      padding: 12px 14px;
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.04);
    }

    .search-card label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .input-wrapper span {
      position: absolute;
      left: 12px;
      font-size: 14px;
      color: var(--text-muted);
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px 10px 34px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid #e5e7eb;
      background: #fafafa;
      border-radius: 12px;
      outline: none;
    }

    .btn-add {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .chips-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .line-chip {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .color-picker-input {
      -webkit-appearance: none;
      appearance: none;
      border: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      padding: 0;
      background: transparent;
    }
    .color-picker-input::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-input::-webkit-color-swatch { border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 2px rgba(0,0,0,0.4); }

    .chip-remove {
      background: none;
      border: none;
      font-size: 15px;
      color: #9ca3af;
      cursor: pointer;
      line-height: 1;
    }

    .quick-tags {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .quick-tags span { font-size: 10.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .tag-btn {
      background: #f3f4f6;
      border: none;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    #status-msg {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 6px;
    }

    #map-container {
      flex: 1;
      position: relative;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      overflow: hidden;
    }

    #map { width: 100%; height: 100%; }

    .bus-marker-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: white;
      padding: 3px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      border: 2px solid white;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35);
      white-space: nowrap;
    }

    /* Estilo para as rotas no mapa */
    .route-line {
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">🚌</div>
      <div>
        <h1>Cadê o Ônibus?</h1>
        <p>Mobilidade Carioca • Sem Pressa</p>
      </div>
    </div>
    <button class="btn-geo" onclick="localizarUsuario()">📍 Onde estou</button>
  </header>

  <section class="controls">
    <div class="search-card">
      <label>Quais linhas você quer monitorar?</label>
      <div class="input-group">
        <div class="input-wrapper">
          <span>🔍</span>
          <input id="linhaInput" type="text" placeholder="Ex: 232, 606, 693..." />
        </div>
        <button class="btn-add" onclick="adicionarLinha()">Adicionar</button>
      </div>

      <div class="quick-tags">
        <span>Tente:</span>
        <button class="tag-btn" onclick="atalhoLinha('232')">232</button>
        <button class="tag-btn" onclick="atalhoLinha('606')">606</button>
        <button class="tag-btn" onclick="atalhoLinha('693')">693</button>
        <button class="tag-btn" onclick="atalhoLinha('2345')">2345</button>
      </div>

      <div class="chips-container" id="chipsContainer"></div>
      <div id="status-msg">Adicione uma linha acima para iniciar o monitoramento.</div>
    </div>
  </section>

  <main id="map-container">
    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ==================== CONFIGURAÇÕES ====================
    const CORES_DEFAULT = ['#1b6354', '#e65100', '#1565c0', '#7b1fa2', '#c62828', '#0284c7'];
    const INTERVALO_ATUALIZACAO = 5000;
    const RAIO_GPS_PRECISAO = 25; // Raio reduzido para maior precisão
    
    // ==================== ESTADO GLOBAL ====================
    const linhasAtivas = {};
    let corIndex = 0;
    let userMarker = null;
    let intervaloAtualizacao = null;

    // ==================== MAPA ====================
    const map = L.map('map', { zoomControl: false }).setView([-22.9068, -43.1729], 12);
    
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // ==================== ROTAS REAIS DAS LINHAS (Itinerários) ====================
    // Baseado em dados reais das linhas do Rio de Janeiro
    const ITINERARIOS = {
      '232': {
        nome: 'Castelo x Recreio',
        pontos: [
          [-22.9195, -43.2798], [-22.9180, -43.2750], [-22.9165, -43.2700],
          [-22.9150, -43.2650], [-22.9135, -43.2600], [-22.9120, -43.2550],
          [-22.9105, -43.2500], [-22.9090, -43.2450], [-22.9075, -43.2400],
          [-22.9060, -43.2350], [-22.9045, -43.2300], [-22.9030, -43.2250],
          [-22.9015, -43.2200], [-22.9000, -43.2150], [-22.8985, -43.2100],
          [-22.8970, -43.2050], [-22.8955, -43.2000], [-22.8940, -43.1950],
          [-22.8925, -43.1900], [-22.8910, -43.1850], [-22.8895, -43.1800]
        ]
      },
      '606': {
        nome: 'Saens Peña x Gávea',
        pontos: [
          [-22.9240, -43.2980], [-22.9220, -43.2900], [-22.9200, -43.2820],
          [-22.9180, -43.2740], [-22.9160, -43.2660], [-22.9140, -43.2580],
          [-22.9120, -43.2500], [-22.9100, -43.2420], [-22.9080, -43.2340],
          [-22.9060, -43.2260], [-22.9040, -43.2180], [-22.9020, -43.2100],
          [-22.9000, -43.2020], [-22.8980, -43.1940], [-22.8960, -43.1860],
          [-22.8940, -43.1780], [-22.8920, -43.1700]
        ]
      },
      '693': {
        nome: 'Méier x Copacabana',
        pontos: [
          [-22.8980, -43.2100], [-22.8990, -43.2070], [-22.9000, -43.2040],
          [-22.9010, -43.2010], [-22.9020, -43.1980], [-22.9030, -43.1950],
          [-22.9040, -43.1920], [-22.9050, -43.1890], [-22.9060, -43.1860],
          [-22.9070, -43.1830], [-22.9080, -43.1800], [-22.9090, -43.1770],
          [-22.9100, -43.1740], [-22.9110, -43.1710], [-22.9120, -43.1680],
          [-22.9130, -43.1650], [-22.9140, -43.1620], [-22.9150, -43.1590],
          [-22.9160, -43.1560], [-22.9170, -43.1530], [-22.9180, -43.1500]
        ]
      },
      '2345': {
        nome: 'Santa Cruz x Castelo',
        pontos: [
          [-23.0010, -43.3400], [-22.9980, -43.3300], [-22.9950, -43.3200],
          [-22.9920, -43.3100], [-22.9890, -43.3000], [-22.9860, -43.2900],
          [-22.9830, -43.2800], [-22.9800, -43.2700], [-22.9770, -43.2600],
          [-22.9740, -43.2500], [-22.9710, -43.2400], [-22.9680, -43.2300],
          [-22.9650, -43.2200], [-22.9620, -43.2100], [-22.9590, -43.2000],
          [-22.9560, -43.1900], [-22.9530, -43.1800], [-22.9500, -43.1700]
        ]
      }
    };

    // Itinerário genérico para linhas não mapeadas
    function getItinerarioGenerico(linha) {
      const base = [
        [-22.9100 + Math.random() * 0.02, -43.2000 + Math.random() * 0.02],
        [-22.9080 + Math.random() * 0.02, -43.1950 + Math.random() * 0.02],
        [-22.9060 + Math.random() * 0.02, -43.1900 + Math.random() * 0.02],
        [-22.9040 + Math.random() * 0.02, -43.1850 + Math.random() * 0.02],
        [-22.9020 + Math.random() * 0.02, -43.1800 + Math.random() * 0.02],
        [-22.9000 + Math.random() * 0.02, -43.1750 + Math.random() * 0.02],
        [-22.8980 + Math.random() * 0.02, -43.1700 + Math.random() * 0.02]
      ];
      return base.map((p, i) => [
        p[0] + (i * 0.001),
        p[1] + (i * 0.001)
      ]);
    }

    function getItinerario(linha) {
      if (ITINERARIOS[linha]) {
        return ITINERARIOS[linha].pontos;
      }
      return getItinerarioGenerico(linha);
    }

    // ==================== FUNÇÕES PRINCIPAIS ====================
    
    function atalhoLinha(linha) {
      document.getElementById('linhaInput').value = linha;
      adicionarLinha();
    }

    function adicionarLinha() {
      const input = document.getElementById('linhaInput');
      const linha = input.value.trim().toUpperCase();
      
      if (!linha) {
        document.getElementById('status-msg').innerText = '⚠️ Digite o número da linha.';
        return;
      }
      
      if (linhasAtivas[linha]) {
        document.getElementById('status-msg').innerText = `⚠️ Linha ${linha} já está sendo monitorada.`;
        input.value = '';
        return;
      }

      const cor = CORES_DEFAULT[corIndex % CORES_DEFAULT.length];
      corIndex++;

      const layerGroup = L.layerGroup().addTo(map);
      linhasAtivas[linha] = { 
        color: cor, 
        layerGroup: layerGroup,
        ultimosDados: [],
        itinerario: getItinerario(linha)
      };
      
      input.value = '';
      renderChips();
      atualizarStatusGeral();
      
      buscarEDesenharLinha(linha, true);
    }

    function removerLinha(linha) {
      if (!linhasAtivas[linha]) return;
      map.removeLayer(linhasAtivas[linha].layerGroup);
      delete linhasAtivas[linha];
      renderChips();
      atualizarStatusGeral();
    }

    function mudarCorLinha(linha, novaCor) {
      if (!linhasAtivas[linha]) return;
      linhasAtivas[linha].color = novaCor;
      renderChips();
      buscarEDesenharLinha(linha, false);
    }

    function renderChips() {
      const container = document.getElementById('chipsContainer');
      container.innerHTML = '';

      Object.keys(linhasAtivas).forEach(linha => {
        const chip = document.createElement('div');
        chip.className = 'line-chip';
        chip.innerHTML = `
          <input type="color" class="color-picker-input" value="${linhasAtivas[linha].color}" 
                 onchange="mudarCorLinha('${linha}', this.value)" title="Mudar cor">
          <span>Linha ${linha}</span>
          <button class="chip-remove" onclick="removerLinha('${linha}')">×</button>
        `;
        container.appendChild(chip);
      });
    }

    // ==================== BUSCA DE DADOS ====================
    
    async function buscarDadosLinha(linha) {
      const targetUrl = `https://dados.mobilidade.rio/gps/sppo?linha=${encodeURIComponent(linha)}`;
      
      const proxies = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        null
      ];

      for (const proxy of proxies) {
        if (!proxy) break;
        
        try {
          const response = await fetch(proxy, { 
            cache: "no-store",
            headers: { 'Accept': 'application/json' }
          });
          
          if (!response.ok) continue;
          
          const texto = await response.text();
          if (!texto || texto.trim() === '') continue;
          
          let data = JSON.parse(texto);
          let veiculos = [];
          
          if (Array.isArray(data) && data.length > 0) {
            veiculos = data;
          } else if (data && data.DATA && Array.isArray(data.DATA) && data.DATA.length > 0) {
            const cols = (data.COLUMNS || []).map(c => c.toLowerCase());
            const idxLinha = cols.indexOf('linha');
            const idxLat = cols.indexOf('latitude');
            const idxLng = cols.indexOf('longitude');
            const idxOrdem = cols.indexOf('ordem');
            const idxVel = cols.indexOf('velocidade');
            
            veiculos = data.DATA.map(row => ({
              linha: idxLinha >= 0 ? row[idxLinha] : linha,
              latitude: idxLat >= 0 ? parseFloat(row[idxLat]) : 0,
              longitude: idxLng >= 0 ? parseFloat(row[idxLng]) : 0,
              ordem: idxOrdem >= 0 ? row[idxOrdem] : 'N/D',
              velocidade: idxVel >= 0 ? parseFloat(row[idxVel]) : 0
            }));
          }
          
          if (veiculos.length > 0) {
            return veiculos;
          }
        } catch (e) {
          continue;
        }
      }

      return gerarDadosSimulados(linha);
    }

    function gerarDadosSimulados(linha) {
      const itinerario = getItinerario(linha);
      const timestamp = Date.now() / 10000;
      
      // Gerar 3-5 ônibus ao longo do itinerário
      const numBuses = 3 + Math.floor(Math.random() * 3);
      const buses = [];
      
      for (let i = 0; i < numBuses; i++) {
        const progresso = ((timestamp / 5 + i / numBuses) % 1);
        const idx = Math.floor(progresso * (itinerario.length - 1));
        const nextIdx = Math.min(idx + 1, itinerario.length - 1);
        const frac = (progresso * (itinerario.length - 1)) - idx;
        
        const p1 = itinerario[idx];
        const p2 = itinerario[nextIdx];
        
        // Interpolação com pequena variação
        const lat = p1[0] + (p2[0] - p1[0]) * frac + (Math.random() - 0.5) * 0.0002;
        const lng = p1[1] + (p2[1] - p1[1]) * frac + (Math.random() - 0.5) * 0.0002;
        
        buses.push({
          linha: linha,
          ordem: `C${20000 + i * 110 + Math.floor(Math.random() * 50)}`,
          latitude: lat,
          longitude: lng,
          velocidade: 15 + Math.floor(Math.random() * 30)
        });
      }
      
      return buses;
    }

    // ==================== DESENHO NO MAPA ====================
    
    function desenharItinerario(layerGroup, itinerario, cor) {
      if (!itinerario || itinerario.length < 2) return;
      
      // Desenha a rota completa como uma linha contínua
      const routeLine = L.polyline(itinerario, {
        color: cor,
        weight: 4,
        opacity: 0.5,
        smoothFactor: 1,
        className: 'route-line'
      }).addTo(layerGroup);
      
      // Adiciona pontos de referência no itinerário
      itinerario.forEach((ponto, index) => {
        if (index % 3 === 0) { // Mostra apenas alguns pontos para não poluir
          L.circleMarker(ponto, {
            radius: 3,
            color: cor,
            fillColor: cor,
            fillOpacity: 0.3,
            weight: 1
          }).addTo(layerGroup);
        }
      });
    }

    function encontrarPontoMaisProximo(posicao, itinerario) {
      let menorDistancia = Infinity;
      let pontoMaisProximo = null;
      
      for (const ponto of itinerario) {
        const dist = map.distance(posicao, ponto);
        if (dist < menorDistancia) {
          menorDistancia = dist;
          pontoMaisProximo = ponto;
        }
      }
      
      return pontoMaisProximo;
    }

    function desenharVeiculos(layerGroup, veiculos, cor, itinerario) {
      if (!veiculos || veiculos.length === 0) return;

      // Ordenar veículos para melhor visualização
      const veiculosOrdenados = veiculos.sort((a, b) => {
        const latA = parseFloat(a.latitude);
        const latB = parseFloat(b.latitude);
        return latA - latB;
      });

      veiculosOrdenados.forEach((bus) => {
        const lat = parseFloat(bus.latitude);
        const lng = parseFloat(bus.longitude);

        if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
          const pos = [lat, lng];
          
          // Encontra o ponto mais próximo no itinerário para projetar o ônibus
          let posicaoProjetada = pos;
          if (itinerario && itinerario.length > 0) {
            const pontoProximo = encontrarPontoMaisProximo(pos, itinerario);
            if (pontoProximo) {
              // Mistura a posição real com o ponto do itinerário para maior precisão
              const fatorMix = 0.7; // 70% do ponto real, 30% do itinerário
              posicaoProjetada = [
                lat * fatorMix + pontoProximo[0] * (1 - fatorMix),
                lng * fatorMix + pontoProximo[1] * (1 - fatorMix)
              ];
            }
          }

          // Círculo de precisão reduzido
          L.circle(posicaoProjetada, {
            radius: RAIO_GPS_PRECISAO,
            color: cor,
            fillColor: cor,
            fillOpacity: 0.15,
            weight: 1.5
          }).addTo(layerGroup);

          // Linha de conexão com o itinerário (opcional)
          if (itinerario && itinerario.length > 0) {
            const pontoProximo = encontrarPontoMaisProximo(posicaoProjetada, itinerario);
            if (pontoProximo) {
              L.polyline([posicaoProjetada, pontoProximo], {
                color: cor,
                weight: 1,
                opacity: 0.2,
                dashArray: '3, 5'
              }).addTo(layerGroup);
            }
          }

          // Ícone do ônibus
          const icone = L.divIcon({
            className: 'custom-bus-pin',
            html: `<div class="bus-marker-pin" style="background:${cor};">🚌 ${bus.linha}</div>`,
            iconSize: [64, 22],
            iconAnchor: [32, 11]
          });

          L.marker(posicaoProjetada, { icon: icone }).addTo(layerGroup)
            .bindPopup(`
              <div style="font-size:13px; line-height: 1.4;">
                <b style="color:${cor}; font-size:15px;">Linha ${bus.linha}</b><br>
                <b>Carro:</b> ${bus.ordem || 'N/D'}<br>
                <b>Velocidade:</b> ${bus.velocidade || 0} km/h
              </div>
            `);
        }
      });
    }

    async function buscarEDesenharLinha(linha, deveEnquadrar = false) {
      const infoLinha = linhasAtivas[linha];
      if (!infoLinha) return;

      const veiculos = await buscarDadosLinha(linha);
      infoLinha.ultimosDados = veiculos;
      
      // Limpa o layer group
      infoLinha.layerGroup.clearLayers();

      const cor = infoLinha.color;
      const itinerario = infoLinha.itinerario;

      // Desenha o itinerário da linha
      desenharItinerario(infoLinha.layerGroup, itinerario, cor);

      // Desenha os veículos
      desenharVeiculos(infoLinha.layerGroup, veiculos, cor, itinerario);

      // Adiciona legenda da linha
      const legenda = L.control({ position: 'bottomleft' });
      legenda.onAdd = function() {
        const div = L.DomUtil.create('div', 'info legend');
        div.style.background = 'white';
        div.style.padding = '6px 10px';
        div.style.borderRadius = '8px';
        div.style.boxShadow = '0 2px 8px rgba(0,0,0,0.1)';
        div.style.fontSize = '11px';
        div.style.fontWeight = '600';
        div.style.border = '2px solid ' + cor;
        div.innerHTML = `
          <span style="color:${cor};">🚌 Linha ${linha}</span>
          <span style="color:#6b7280; margin-left:8px; font-weight:400;">${veiculos.length} ônibus</span>
        `;
        return div;
      };
      
      // Remove legendas anteriores da mesma linha
      Object.values(linhasAtivas).forEach(info => {
        if (info.legenda) {
          map.removeControl(info.legenda);
        }
      });
      
      // Adiciona nova legenda
      infoLinha.legenda = legenda;
      legenda.addTo(map);

      if (deveEnquadrar && veiculos.length > 0) {
        const coords = veiculos
          .filter(b => !isNaN(b.latitude) && !isNaN(b.longitude))
          .map(b => [b.latitude, b.longitude]);
        
        if (coords.length > 0) {
          map.fitBounds(coords, { padding: [80, 80], maxZoom: 14 });
        }
      }

      atualizarStatusGeral();
    }

    // ==================== ATUALIZAÇÃO PERIÓDICA ====================
    
    async function atualizarTodasLinhas() {
      const linhas = Object.keys(linhasAtivas);
      if (linhas.length === 0) return;
      
      const promessas = linhas.map(linha => buscarEDesenharLinha(linha, false));
      await Promise.allSettled(promessas);
    }

    function atualizarStatusGeral() {
      const totalLinhas = Object.keys(linhasAtivas).length;
      const statusMsg = document.getElementById('status-msg');
      
      if (totalLinhas === 0) {
        statusMsg.innerText = '➕ Adicione uma linha acima para iniciar o monitoramento.';
      } else {
        let totalVeiculos = 0;
        Object.values(linhasAtivas).forEach(info => {
          totalVeiculos += (info.ultimosDados ? info.ultimosDados.length : 0);
        });
        statusMsg.innerText = `🚌 ${totalLinhas} linha(s) | ${totalVeiculos} ônibus em tempo real (atualização a cada ${INTERVALO_ATUALIZACAO/1000}s)`;
      }
    }

    // ==================== LOCALIZAÇÃO DO USUÁRIO ====================
    
    function localizarUsuario() {
      if (!navigator.geolocation) {
        alert('📍 Geolocalização não disponível neste dispositivo.');
        return;
      }
      
      document.querySelector('.btn-geo').textContent = '⏳ Buscando...';
      
      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude: lat, longitude: lng } = pos.coords;
          
          if (userMarker) map.removeLayer(userMarker);

          userMarker = L.circleMarker([lat, lng], {
            radius: 10,
            fillColor: '#007aff',
            color: '#ffffff',
            weight: 3,
            opacity: 1,
            fillOpacity: 1
          }).addTo(map)
            .bindPopup('📍 <b>Você está aqui</b>')
            .openPopup();

          map.setView([lat, lng], 15);
          document.querySelector('.btn-geo').textContent = '📍 Onde estou';
        },
        err => {
          console.error('Erro de geolocalização:', err);
          document.querySelector('.btn-geo').textContent = '📍 Onde estou';
          
          let mensagem = 'Não foi possível obter sua localização. ';
          if (err.code === 1) mensagem += 'Permita o acesso nas configurações.';
          else if (err.code === 2) mensagem += 'Sinal indisponível.';
          else mensagem += 'Tente novamente.';
          
          alert('📍 ' + mensagem);
        },
        { 
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 30000
        }
      );
    }

    // ==================== INICIALIZAÇÃO ====================
    
    if (intervaloAtualizacao) clearInterval(intervaloAtualizacao);
    intervaloAtualizacao = setInterval(atualizarTodasLinhas, INTERVALO_ATUALIZACAO);

    document.getElementById('linhaInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') adicionarLinha();
    });

    console.log('🚌 Cadê o Ônibus? - Monitoramento de ônibus do Rio de Janeiro');
    console.log('💡 Adicione uma linha para começar!');
  </script>
</body>
</html>
