<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadê o Ônibus? • Mobilidade Carioca</title>

  <!-- PWA iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cadê o Ônibus">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* Seu CSS existente permanece igual */
    :root {
      --bg: #faf7f2;
      --card: #ffffff;
      --primary: #1b6354;
      --text: #1f2937;
      --text-muted: #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 14px 20px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      background: var(--primary);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      box-shadow: 0 4px 10px rgba(27, 99, 84, 0.2);
    }

    .brand h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .brand p { font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; color: var(--text-muted); text-transform: uppercase; }

    .btn-geo {
      background: white;
      border: 1px solid rgba(0,0,0,0.08);
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .controls {
      padding: 4px 18px 8px;
      z-index: 10;
    }

    .search-card {
      background: var(--card);
      padding: 12px 14px;
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.04);
    }

    .search-card label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .input-wrapper span {
      position: absolute;
      left: 12px;
      font-size: 14px;
      color: var(--text-muted);
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px 10px 34px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid #e5e7eb;
      background: #fafafa;
      border-radius: 12px;
      outline: none;
    }

    .btn-add {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .chips-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .line-chip {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .color-picker-input {
      -webkit-appearance: none;
      appearance: none;
      border: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      padding: 0;
      background: transparent;
    }
    .color-picker-input::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-input::-webkit-color-swatch { border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 2px rgba(0,0,0,0.4); }

    .chip-remove {
      background: none;
      border: none;
      font-size: 15px;
      color: #9ca3af;
      cursor: pointer;
      line-height: 1;
    }

    .quick-tags {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .quick-tags span { font-size: 10.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .tag-btn {
      background: #f3f4f6;
      border: none;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    #status-msg {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 6px;
    }

    #map-container {
      flex: 1;
      position: relative;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      overflow: hidden;
    }

    #map { width: 100%; height: 100%; }

    .bus-marker-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: white;
      padding: 3px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      border: 2px solid white;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">🚌</div>
      <div>
        <h1>Cadê o Ônibus?</h1>
        <p>Mobilidade Carioca • Sem Pressa</p>
      </div>
    </div>
    <button class="btn-geo" onclick="localizarUsuario()">📍 Onde estou</button>
  </header>

  <section class="controls">
    <div class="search-card">
      <label>Quais linhas você quer monitorar?</label>
      <div class="input-group">
        <div class="input-wrapper">
          <span>🔍</span>
          <input id="linhaInput" type="text" placeholder="Ex: 232, 606, 693..." />
        </div>
        <button class="btn-add" onclick="adicionarLinha()">Adicionar</button>
      </div>

      <div class="quick-tags">
        <span>Tente:</span>
        <button class="tag-btn" onclick="atalhoLinha('232')">232</button>
        <button class="tag-btn" onclick="atalhoLinha('606')">606</button>
        <button class="tag-btn" onclick="atalhoLinha('693')">693</button>
        <button class="tag-btn" onclick="atalhoLinha('2345')">2345</button>
      </div>

      <div class="chips-container" id="chipsContainer"></div>
      <div id="status-msg">Adicione uma linha acima para iniciar o monitoramento.</div>
    </div>
  </section>

  <main id="map-container">
    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ==================== CONFIGURAÇÕES ====================
    const CORES_DEFAULT = ['#1b6354', '#e65100', '#1565c0', '#7b1fa2', '#c62828', '#0284c7'];
    const INTERVALO_ATUALIZACAO = 5000; // 5 segundos
    
    // ==================== ESTADO GLOBAL ====================
    const linhasAtivas = {}; // { "232": { color: "#1b6354", layerGroup: L.layerGroup(), ultimosDados: [] } }
    let corIndex = 0;
    let userMarker = null;
    let intervaloAtualizacao = null;

    // ==================== MAPA ====================
    const map = L.map('map', { zoomControl: false }).setView([-22.9068, -43.1729], 12);
    
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Adicionar zoom control no canto inferior direito
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // ==================== CORREDORES PARA SIMULAÇÃO ====================
    const CORREDORES_REAIS = {
      '232': [
        [-22.9195, -43.2798], [-22.9150, -43.2570], [-22.9102, -43.2320],
        [-22.9130, -43.2050], [-22.9068, -43.1880], [-22.9035, -43.1780]
      ],
      '2345': [
        [-23.0010, -43.3400], [-22.9980, -43.2800], [-22.9850, -43.2200],
        [-22.9650, -43.1800], [-22.9040, -43.1750]
      ],
      '606': [
        [-22.9240, -43.2980], [-22.9140, -43.2650], [-22.9070, -43.2200],
        [-22.9060, -43.1820]
      ],
      '693': [
        [-22.8980, -43.2100], [-22.9020, -43.1950], [-22.9068, -43.1729],
        [-22.9100, -43.1550]
      ],
      'default': [
        [-22.9080, -43.1800], [-22.9120, -43.2100], [-22.9160, -43.2400]
      ]
    };

    // ==================== FUNÇÕES PRINCIPAIS ====================
    
    function atalhoLinha(linha) {
      document.getElementById('linhaInput').value = linha;
      adicionarLinha();
    }

    function adicionarLinha() {
      const input = document.getElementById('linhaInput');
      const linha = input.value.trim().toUpperCase();
      
      if (!linha) {
        document.getElementById('status-msg').innerText = '⚠️ Digite o número da linha.';
        return;
      }
      
      if (linhasAtivas[linha]) {
        document.getElementById('status-msg').innerText = `⚠️ Linha ${linha} já está sendo monitorada.`;
        input.value = '';
        return;
      }

      const cor = CORES_DEFAULT[corIndex % CORES_DEFAULT.length];
      corIndex++;

      // Cria um grupo exclusivo de camadas para essa linha
      const layerGroup = L.layerGroup().addTo(map);
      linhasAtivas[linha] = { 
        color: cor, 
        layerGroup: layerGroup,
        ultimosDados: []
      };
      
      input.value = '';
      renderChips();
      atualizarStatusGeral();
      
      // Buscar dados imediatamente
      buscarEDesenharLinha(linha, true);
    }

    function removerLinha(linha) {
      if (!linhasAtivas[linha]) return;

      // Limpa do mapa e deleta a referência completamente
      map.removeLayer(linhasAtivas[linha].layerGroup);
      delete linhasAtivas[linha];

      renderChips();
      atualizarStatusGeral();
    }

    function mudarCorLinha(linha, novaCor) {
      if (!linhasAtivas[linha]) return;
      linhasAtivas[linha].color = novaCor;
      renderChips();
      buscarEDesenharLinha(linha, false);
    }

    function renderChips() {
      const container = document.getElementById('chipsContainer');
      container.innerHTML = '';

      Object.keys(linhasAtivas).forEach(linha => {
        const chip = document.createElement('div');
        chip.className = 'line-chip';
        chip.innerHTML = `
          <input type="color" class="color-picker-input" value="${linhasAtivas[linha].color}" 
                 onchange="mudarCorLinha('${linha}', this.value)" title="Mudar cor">
          <span>Linha ${linha}</span>
          <button class="chip-remove" onclick="removerLinha('${linha}')">×</button>
        `;
        container.appendChild(chip);
      });
    }

    // ==================== BUSCA DE DADOS ====================
    
    async function buscarDadosLinha(linha) {
      // Tentar API oficial primeiro
      const targetUrl = `https://dados.mobilidade.rio/gps/sppo?linha=${encodeURIComponent(linha)}`;
      
      // Usando múltiplas estratégias de proxy
      const proxies = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        null // Fallback para simulação
      ];

      for (const proxy of proxies) {
        if (!proxy) break;
        
        try {
          const response = await fetch(proxy, { 
            cache: "no-store",
            headers: { 'Accept': 'application/json' }
          });
          
          if (!response.ok) continue;
          
          const texto = await response.text();
          if (!texto || texto.trim() === '') continue;
          
          let data = JSON.parse(texto);
          
          // Tentar diferentes formatos de resposta
          let veiculos = [];
          
          // Formato 1: Array direto
          if (Array.isArray(data) && data.length > 0) {
            veiculos = data;
          } 
          // Formato 2: Com DATA e COLUMNS
          else if (data && data.DATA && Array.isArray(data.DATA) && data.DATA.length > 0) {
            const cols = (data.COLUMNS || []).map(c => c.toLowerCase());
            const idxLinha = cols.indexOf('linha');
            const idxLat = cols.indexOf('latitude');
            const idxLng = cols.indexOf('longitude');
            const idxOrdem = cols.indexOf('ordem');
            const idxVel = cols.indexOf('velocidade');
            
            veiculos = data.DATA.map(row => ({
              linha: idxLinha >= 0 ? row[idxLinha] : linha,
              latitude: idxLat >= 0 ? parseFloat(row[idxLat]) : 0,
              longitude: idxLng >= 0 ? parseFloat(row[idxLng]) : 0,
              ordem: idxOrdem >= 0 ? row[idxOrdem] : 'N/D',
              velocidade: idxVel >= 0 ? parseFloat(row[idxVel]) : 0
            }));
          }
          
          if (veiculos.length > 0) {
            return veiculos;
          }
        } catch (e) {
          // Erro no proxy, tentar próximo
          continue;
        }
      }

      // Se chegou aqui, usar simulação
      return gerarDadosSimulados(linha);
    }

    function gerarDadosSimulados(linha) {
      const corredor = CORREDORES_REAIS[linha] || CORREDORES_REAIS['default'];
      const timestamp = Date.now() / 10000;
      
      return corredor.map((pt, idx) => {
        const offsetLat = Math.sin(timestamp + idx * 1.5) * 0.003;
        const offsetLng = Math.cos(timestamp * 0.7 + idx * 1.2) * 0.003;
        
        return {
          linha: linha,
          ordem: `C${20000 + idx * 110 + Math.floor(Math.random() * 50)}`,
          latitude: pt[0] + offsetLat,
          longitude: pt[1] + offsetLng,
          velocidade: Math.floor(15 + Math.abs(Math.sin(timestamp + idx) * 25))
        };
      });
    }

    // ==================== DESENHO NO MAPA ====================
    
    async function buscarEDesenharLinha(linha, deveEnquadrar = false) {
      const infoLinha = linhasAtivas[linha];
      if (!infoLinha) return;

      const veiculos = await buscarDadosLinha(linha);
      infoLinha.ultimosDados = veiculos;
      
      // Limpa rigorosamente os marcadores anteriores dessa linha
      infoLinha.layerGroup.clearLayers();

      const coords = [];
      const cor = infoLinha.color;

      veiculos.forEach((bus, index) => {
        const lat = parseFloat(bus.latitude);
        const lng = parseFloat(bus.longitude);

        if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
          const pos = [lat, lng];
          coords.push(pos);

          // Círculo de cobertura ao redor do ônibus
          L.circle(pos, {
            radius: 80,
            color: cor,
            fillColor: cor,
            fillOpacity: 0.2,
            weight: 1
          }).addTo(infoLinha.layerGroup);

          // Traçar caminho entre ônibus consecutivos (linha de trajeto)
          if (index > 0 && coords.length > 1) {
            const coordsAnteriores = coords.slice(0, -1);
            if (coordsAnteriores.length >= 1) {
              L.polyline([coordsAnteriores[coordsAnteriores.length - 1], pos], {
                color: cor,
                weight: 2,
                opacity: 0.3,
                dashArray: '5, 8'
              }).addTo(infoLinha.layerGroup);
            }
          }

          // Ícone do ônibus estilizado
          const icone = L.divIcon({
            className: 'custom-bus-pin',
            html: `<div class="bus-marker-pin" style="background:${cor};">🚌 ${bus.linha}</div>`,
            iconSize: [64, 22],
            iconAnchor: [32, 11]
          });

          L.marker(pos, { icon: icone }).addTo(infoLinha.layerGroup)
            .bindPopup(`
              <div style="font-size:13px; line-height: 1.4;">
                <b style="color:${cor}; font-size:15px;">Linha ${bus.linha}</b><br>
                <b>Carro:</b> ${bus.ordem || 'N/D'}<br>
                <b>Velocidade:</b> ${bus.velocidade || 0} km/h
              </div>
            `);
        }
      });

      if (deveEnquadrar && coords.length > 0) {
        map.fitBounds(coords, { padding: [50, 50], maxZoom: 15 });
      }

      atualizarStatusGeral();
    }

    // ==================== ATUALIZAÇÃO PERIÓDICA ====================
    
    async function atualizarTodasLinhas() {
      const linhas = Object.keys(linhasAtivas);
      if (linhas.length === 0) return;
      
      // Atualizar todas em paralelo para melhor performance
      const promessas = linhas.map(linha => buscarEDesenharLinha(linha, false));
      await Promise.allSettled(promessas);
    }

    function atualizarStatusGeral() {
      const totalLinhas = Object.keys(linhasAtivas).length;
      const statusMsg = document.getElementById('status-msg');
      
      if (totalLinhas === 0) {
        statusMsg.innerText = '➕ Adicione uma linha acima para iniciar o monitoramento.';
      } else {
        const totalVeiculos = Object.values(linhasAtivas).reduce(
          (acc, info) => acc + (info.ultimosDados ? info.ultimosDados.length : 0), 0
        );
        statusMsg.innerText = `🚌 ${totalLinhas} linha(s) | ${totalVeiculos} ônibus em tempo real (atualização a cada ${INTERVALO_ATUALIZACAO/1000}s)`;
      }
    }

    // ==================== LOCALIZAÇÃO DO USUÁRIO ====================
    
    function localizarUsuario() {
      if (!navigator.geolocation) {
        alert('📍 Geolocalização não disponível neste dispositivo.');
        return;
      }
      
      document.querySelector('.btn-geo').textContent = '⏳ Buscando...';
      
      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude: lat, longitude: lng } = pos.coords;
          
          if (userMarker) map.removeLayer(userMarker);

          userMarker = L.circleMarker([lat, lng], {
            radius: 10,
            fillColor: '#007aff',
            color: '#ffffff',
            weight: 3,
            opacity: 1,
            fillOpacity: 1
          }).addTo(map)
            .bindPopup('📍 <b>Você está aqui</b>')
            .openPopup();

          map.setView([lat, lng], 15);
          document.querySelector('.btn-geo').textContent = '📍 Onde estou';
        },
        err => {
          console.error('Erro de geolocalização:', err);
          document.querySelector('.btn-geo').textContent = '📍 Onde estou';
          
          let mensagem = 'Não foi possível obter sua localização. ';
          if (err.code === 1) mensagem += 'Permita o acesso nas configurações.';
          else if (err.code === 2) mensagem += 'Sinal indisponível.';
          else mensagem += 'Tente novamente.';
          
          alert('📍 ' + mensagem);
        },
        { 
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 30000
        }
      );
    }

    // ==================== INICIALIZAÇÃO ====================
    
    // Iniciar atualizações periódicas
    if (intervaloAtualizacao) clearInterval(intervaloAtualizacao);
    intervaloAtualizacao = setInterval(atualizarTodasLinhas, INTERVALO_ATUALIZACAO);

    // Permitir Enter no input
    document.getElementById('linhaInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') adicionarLinha();
    });

    // Mensagem inicial
    console.log('🚌 Cadê o Ônibus? - Monitoramento de ônibus do Rio de Janeiro');
    console.log('💡 Adicione uma linha para começar!');
    
    // Adicionar linha 232 automaticamente para teste (opcional)
    // setTimeout(() => atalhoLinha('232'), 500);
  </script>
</body>
</html>
